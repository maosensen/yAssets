# 初稿由功能考古生成(2026-07-28,依据 CHANGELOG v0.1.0→v0.1.25 + 全量功能核对 + readiness DB 迁移),待人批改。
# 部分历史条目的 shippedIn 无法从 CHANGELOG 唯一对应,已省略(不猜)。

